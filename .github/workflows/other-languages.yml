# Python, Ruby and Cucumber. Grouped because each is a single small
# workspace; splitting them into three workflows would be more YAML than
# signal.
name: Python, Ruby, Cucumber

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: other-languages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      # pytest-randomly shuffles the order, so an order dependency fails
      # here rather than the first time the suite is parallelised.
      - run: PYTHONPATH=. pytest -q --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: python/reports/
          retention-days: 7

  ruby:
    name: Ruby (RSpec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rspec --format progress

  cucumber:
    name: Cucumber (given-when-then)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cucumber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cucumber/package-lock.json
      - run: npm ci
      - run: npx cucumber-js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cucumber/reports/
          retention-days: 7
